name: CI

on:
  push:
    branches: [main, "phase*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  UV_FROZEN: "1"
  # Qt never needs a display in CI.
  QT_QPA_PLATFORM: "offscreen"
  QT_LOGGING_RULES: "*.debug=false"

jobs:
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  shellcheck:
    name: shellcheck (setup.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck --severity=warning setup.sh
      - run: bash -n setup.sh

  typecheck:
    name: typecheck (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run mypy

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest tests/unit -q --cov --cov-report=term

  property:
    name: property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest tests/property -q

  differential:
    name: differential oracle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest tests/differential -q

  ui:
    name: ui smoke (offscreen)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest tests/ui -q
      - run: uv run chess-obs ui --smoke

  bench-smoke:
    name: benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest tests/bench -q

  docs-freshness:
    name: docs freshness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # No install on purpose: this must work before dependencies exist.
      - run: python3 tools/check_docs.py

  import-graph:
    name: import graph guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }}
      - run: uv run pytest tests/unit/test_import_graph.py -q

  jit-disabled:
    name: tests with numba JIT disabled
    runs-on: ubuntu-latest
    env:
      NUMBA_DISABLE_JIT: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: uv sync --frozen --python ${{ env.PYTHON_VERSION }} --extra jit
      - run: uv run pytest -q -m "not bench"

  install:
    name: clean install (setup.sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1
      - run: ./setup.sh --check
      - run: ./setup.sh -y
      - run: uv run chess-obs doctor
