[project]
name = "chess-observatory"
dynamic = ["version"]
description = "A computational chess research workstation: an instrument for why a position works."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
authors = [{ name = "Stan Ragets" }]
keywords = ["chess", "analysis", "pyside6", "research", "visualisation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
  "Typing :: Typed",
]
dependencies = [
  "pyside6>=6.12",
  "numpy>=2.3",
  "pyarrow>=17",
]

[project.optional-dependencies]
# Optional accelerators and learners. Nothing here is required to run the app.
jit = ["numba>=0.68"]
ml = ["onnxruntime>=1.32"]
train = ["torch>=2.15"]
gpu = ["onnxruntime-gpu>=1.32"]
ann = ["faiss-cpu>=1.16"]

[project.scripts]
chess-obs = "chess_observatory.cli.main:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-qt>=4.5",
  "pytest-benchmark>=5",
  "pytest-cov>=7",
  "pytest-xdist>=3.8",
  "hypothesis>=6.140",
  "python-chess>=1.999",
  "networkx>=3.5",
  "ruff>=0.14",
  "mypy>=1.19",
  "pre-commit>=4.3",
  "pyinstaller>=6.16",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/chess_observatory/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/chess_observatory"]

[tool.uv]
# The dev group is for contributors; installed by default with `uv sync`.
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF", "PTH", "TID"]
ignore = [
  # Formatter owns line length; E501 would fight it.
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["chess_observatory"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 88

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src"]
warn_unreachable = true
show_error_codes = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

[tool.pytest.ini_options]
minversion = "8.4"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
qt_api = "pyside6"
markers = [
  "slow: takes more than a few seconds",
  "ui: needs a Qt application (offscreen in CI)",
  "bench: performance benchmark",
  "fuzz: randomised robustness test",
  "chaos: fault-injection test",
  "property: hypothesis property test",
  "differential: compares against an external oracle",
]

[tool.coverage.run]
branch = true
source = ["src/chess_observatory"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.benchmark]
min_rounds = 5
max_time = 1.0
